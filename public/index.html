<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Resale Stock</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Archivo+Narrow:wght@500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Resale Stock</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search brand, item, colour…" aria-label="Search">
      <select id="sort" aria-label="Sort">
        <option value="id">Sort: list order</option>
        <option value="hi">Price: high to low</option>
        <option value="lo">Price: low to high</option>
        <option value="int">Interest: strongest first</option>
        <option value="upd">Recently edited</option>
        <option value="sold">Recently sold</option>
      </select>
      <button class="ghost" id="reset" type="button">Clear filters</button>
      <button class="btn pri" id="new" type="button">+ New item</button>
      <button class="ghost" id="logout" type="button">Log out</button>
    </div>
    <div class="row" id="g-st"><span class="lbl">Status</span></div>
    <div class="row" id="g-int"><span class="lbl">Interest</span></div>
    <div class="row" id="g-when"><span class="lbl">Season</span></div>
    <details class="more">
      <summary>More filters: material, type, colour, theme ▾</summary>
      <div class="rows">
        <div class="row" id="g-mat"><span class="lbl">Material</span></div>
        <div class="row" id="g-type"><span class="lbl">Type</span></div>
        <div class="row" id="g-col"><span class="lbl">Colour</span></div>
        <div class="row" id="g-theme"><span class="lbl">Theme</span></div>
      </div>
    </details>
  </div>
</header>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No items match these filters.</p>
</div></main>

<!-- item: photos + edit form -->
<dialog id="dlg" aria-label="Item">
  <button class="close" id="x" type="button" aria-label="Close">✕</button>
  <div class="dlg">
    <div>
      <div class="viewer" id="viewer">
        <img id="big" alt="">
        <p class="nophoto" id="nophoto" hidden>No photos yet</p>
        <button class="nav l" id="pl" type="button" aria-label="Previous photo">‹</button>
        <button class="nav r" id="pr" type="button" aria-label="Next photo">›</button>
        <span class="count" id="cnt"></span>
      </div>
      <div class="strip" id="strip"></div>
      <div class="photobar">
        <label class="btn">+ Add photos<input type="file" id="addph" accept="image/*" multiple hidden></label>
        <button class="btn" id="phl" type="button" title="Move photo left">◀ Move</button>
        <button class="btn" id="phr" type="button" title="Move photo right">Move ▶</button>
        <button class="btn danger" id="phdel" type="button">Delete photo</button>
        <span class="status" id="phstatus"></span>
      </div>
    </div>
    <div class="info" id="info"></div>
  </div>
</dialog>

<!-- approve: was → now -->
<dialog id="approve" class="small" aria-label="Check changes">
  <div class="pane">
    <h3>Check your changes</h3>
    <table class="diff"><thead><tr><th>Field</th><th>Was</th><th>Now</th></tr></thead><tbody id="diffrows"></tbody></table>
    <p class="err" id="saveerr" hidden></p>
    <div class="btns">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn pri" id="ok" type="button">Approve</button>
    </div>
  </div>
</dialog>

<!-- sold -->
<dialog id="selldlg" class="small" aria-label="Mark as sold">
  <form class="pane" id="sellform" method="dialog">
    <h3>Mark as sold</h3>
    <label class="f"><span>Sell price (€)</span><input id="s-price" inputmode="decimal" autocomplete="off"></label>
    <label class="f"><span>Date</span><input id="s-date" type="date" required></label>
    <label class="f"><span>Buyer interest</span><select id="s-int"></select></label>
    <p class="err" id="sellerr" hidden></p>
    <div class="btns">
      <button class="btn" id="sellback" type="button">Back</button>
      <button class="btn pri" type="submit">Confirm sale</button>
    </div>
  </form>
</dialog>

<script src="/app.js"></script>
</body>
</html>
